<!-- Public takedown request form. -->
{% extends "base.html" %}
{% block title %}Content removal request{% endblock %}
{% block content %}<main class="container stack"><h1>Content removal request</h1><p>This form can be used by anyone.</p>{% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}<form class="card stack" method="post" action="/takedown"><label class="form-field">Name<input class="input" name="name" maxlength="100" required></label><label class="form-field">Contact<input class="input" name="contact" maxlength="200" required></label><label class="form-field">Content URL<input class="input" name="target_url" maxlength="500" required></label><label class="form-field">Message<textarea class="textarea" name="message" maxlength="2000" rows="8" required></textarea></label><button class="btn btn-primary">Submit request</button></form><p class="muted"></p></main>{% endblock %}
