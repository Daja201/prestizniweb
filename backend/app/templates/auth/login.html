{% extends "base.html" %}
{% block title %}Login{% endblock %}
{% block content %}
<div class="auth-page stack">
  <h1>LOGIN</h1>
  {% if error %}<div class="flash flash-error" role="alert">{{ error }}</div>{% endif %}
  <div class="card stack login-panel">
    <form class="stack" method="post" action="/login">
      <input type="hidden" name="next" value="{{ next | default('/') }}">
      <div class="form-field">
        <label for="email">Email</label>
        <input class="input" type="email" id="email" name="email" required autofocus autocomplete="email" placeholder="name@example.com">
      </div>
      <div class="login-warning">Note: Emails will mostly go to your spam folder at first.</div>
      <button class="btn btn-primary" type="submit" style="margin-top: 8px;">CONTINUE</button>
    </form>
  </div>
</div>
{% endblock %}
