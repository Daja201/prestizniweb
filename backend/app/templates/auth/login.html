{# Přihlašovací stránka – zadání školní e-mailové adresy #}
{% extends "base.html" %}
{% block title %}Přihlášení{% endblock %}

{% block content %}
<div class="container stack auth-page">
  <h1>Přihlášení</h1>
  <p class="muted">Pouze pro adresy @{{ settings.allowed_email_domain }}</p>

  {% if error %}
    <div class="flash flash-error" role="alert">{{ error }}</div>
  {% endif %}

  <div class="card stack">
    <form method="post" action="/login">
      <input type="hidden" name="next" value="{{ next | default('/') }}">
      <div class="form-field">
        <label for="email">Školní e-mail</label>
        <input
          class="input"
          type="email"
          id="email"
          name="email"
          required
          autofocus
          autocomplete="email"
          placeholder="jan.novak@{{ settings.allowed_email_domain }}"
        >
      </div>
      <button class="btn btn-primary" type="submit">Odeslat přihlašovací odkaz</button>
    </form>
  </div>
</div>
{% endblock %}
