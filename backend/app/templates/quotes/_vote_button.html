{# Renders the HTMX quote vote toggle. #}
<form class="row" hx-post="/quotes/{{ quote.id }}/vote" hx-target="#quote-vote-{{ quote.id }}" hx-swap="outerHTML">
  <span id="quote-vote-{{ quote.id }}">
    <button class="btn{% if voted %} btn-primary{% else %} btn-ghost{% endif %}" type="submit" aria-pressed="{{ 'true' if voted else 'false' }}">
      {% if voted %}▲ Voted{% else %}▲ Vote{% endif %} · {{ quote.votes_count }}
    </button>
  </span>
</form>
