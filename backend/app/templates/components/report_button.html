<!-- Report control usable without JavaScript, with an HTMX enhancement. -->
{% macro report_button(target_type, target_id) %}
<details class="report">
  <summary class="btn btn-ghost">Report</summary>
  <form class="stack" method="post" action="/reports" hx-post="/reports" hx-target="closest details" hx-swap="outerHTML">
    <input type="hidden" name="target_type" value="{{ target_type }}">
    <input type="hidden" name="target_id" value="{{ target_id }}">
    <label class="form-field">Reason
      <select class="select" name="reason" required>
        <option value="spam">Spam</option>
        <option value="harassment">Harassment</option>
        <option value="personal_info">Personal data</option>
        <option value="inappropriate">Inappropriate content</option>
        <option value="copyright">Copyright</option>
        <option value="other">Other</option>
      </select>
    </label>
    <label class="form-field">Podrobnosti
      <textarea class="textarea" name="details" maxlength="500" rows="3"></textarea>
    </label>
    <button class="btn btn-danger" type="submit">Submit report</button>
  </form>
</details>
{% endmacro %}
