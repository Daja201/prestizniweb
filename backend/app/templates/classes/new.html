<!-- Class profile creation form. -->
{% extends "base.html" %}
{% block title %}New class{% endblock %}
{% block content %}
<div class="container stack">
  <h1>Create class profile</h1>
  {% if error %}<div class="flash flash-error">{{ error }}</div>{% endif %}
  <form class="card stack" method="post" action="/classes">
    <label class="form-field">Name<input class="input" name="name" maxlength="60" minlength="2" required></label>
    <label class="form-field">Description<textarea class="textarea" name="description" maxlength="500" rows="6"></textarea></label>
    <button class="btn btn-primary" type="submit">Submit for approval</button>
  </form>
</div>
{% endblock %}
