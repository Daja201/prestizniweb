# postgresql.conf - tuned for a ~300MB memory-limited container, up to ~2000 users
listen_addresses = '*'
max_connections = 30

shared_buffers = 96MB
work_mem = 4MB
maintenance_work_mem = 32MB
effective_cache_size = 256MB

wal_level = replica
max_wal_size = 512MB
min_wal_size = 128MB
checkpoint_completion_target = 0.9

random_page_cost = 1.1
effective_io_concurrency = 200

log_min_duration_statement = 500
log_line_prefix = '%m [%p] %q%u@%d '
log_timezone = 'UTC'

timezone = 'UTC'
datestyle = 'iso, mdy'

autovacuum = on
autovacuum_max_workers = 2